<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="card">
      <div class="search-row">
        <input
          id="cityInput"
          type="text"
          placeholder="Enter a city.."
          autocomplete="off"
        />
        <button id="searchBtn">Search</button>
      </div>

      <hr />

      <div id="result">
        <div class="weather-body">
          <div class="placeholder">
            Search for a city to see the current weather.
          </div>
        </div>
      </div>

      <hr />

      <div class="footer-note">

        <a href="#" target="_blank" rel="noopener">Ojochide Ibrahim</a>, is
        <a
          href="https://github.com/ibrahimeli030-lang/Week7_project"
          target="_blank"
          rel="noopener"
          >open-sourced on GitHub</a
        >
        and
        <a href="https://myweek7pr.netlify.app/" target="_blank" rel="noopener"
          >hosted on Netlify</a
        >
      </div>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
